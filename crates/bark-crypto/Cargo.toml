[package]
name = "bark-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bark-core = { workspace = true }

blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["std", "zeroize"] }
getrandom = "0.3.4"
hex = "0.4.3"
hkdf = "0.12.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
# `static_secrets` exposes StaticSecret, which BARK uses for the per-session
# Diffie-Hellman keypair. See the note in handshake.rs on why not EphemeralSecret.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
]
