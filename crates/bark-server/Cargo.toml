[package]
name = "bark-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bark-server"
path = "src/main.rs"

[lib]
name = "bark_server"
path = "src/lib.rs"

[dependencies]
bark-core = { workspace = true }
bark-crypto = { workspace = true }
bark-net = { workspace = true }
bark-proto = { workspace = true }

getrandom = "0.3.4"
hex = "0.4.3"
quinn = { version = "0.11.9", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
    "bloom",
] }
# `bundled` compiles SQLite from source into the executable. The operator never
# installs, configures or administers a database; there is nothing to set up.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }
